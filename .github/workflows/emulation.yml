name: Android Emulator E2E Tests

on:
  workflow_run:
    workflows: ["Build & Release Android APK"]
    types:
      - completed
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: emulator-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  android-emulator-e2e:
    name: Android Emulator E2E Tests (Option C)
    runs-on: macos-14
    timeout-minutes: 15
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download APK Artifact from Release Workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: youtube-viewer-apks
          path: release-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and Stage Pre-Built Android APK from Release Workflow
        id: stage_apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p android-shell/app/build/outputs/apk/debug
          if [ ! -f "release-artifacts/YouTube-Viewer-debug.apk" ] && command -v gh >/dev/null 2>&1; then
            echo "Attempting to retrieve latest build artifact from release-apk workflow via GitHub CLI..."
            gh run download -R "${{ github.repository }}" -n youtube-viewer-apks -D release-artifacts || true
          fi

          if [ -f "release-artifacts/YouTube-Viewer-debug.apk" ]; then
            echo "✅ Successfully staged pre-built Android APK from release-apk workflow. Skipping duplicate compilation."
            cp release-artifacts/YouTube-Viewer-debug.apk android-shell/app/build/outputs/apk/debug/app-debug.apk
            echo "have_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ Pre-built APK not found from upstream workflow. Will compile from source."
            echo "have_apk=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Web Build Artifact (Fallback for source build)
        if: steps.stage_apk.outputs.have_apk != 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize package registry URLs (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        run: |
          if [ -f package-lock.json ]; then
            sed -i -E 's#https?://package-firewall\.replit\.internal/npm/#https://registry.npmjs.org/#g' package-lock.json 2>/dev/null || true
          fi

      - name: Install Web Dependencies (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        timeout-minutes: 3
        run: npm install

      - name: Build Web Application (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        timeout-minutes: 3
        run: |
          if [ ! -f "dist/index.html" ]; then
            npm run build
          fi

      - name: Bundle Web Assets into Android Native Shell (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        run: |
          mkdir -p android-shell/app/src/main/assets
          cp -r dist/* android-shell/app/src/main/assets/
          echo "Bundled web assets:"
          ls -la android-shell/app/src/main/assets/

      - name: Set up Java 17 (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android-shell

      - name: Build Android Debug APK (Fallback)
        if: steps.stage_apk.outputs.have_apk != 'true'
        timeout-minutes: 3
        run: |
          chmod +x android-shell/gradlew
          if [ ! -f "android-shell/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing; downloading wrapper jar..."
            mkdir -p android-shell/gradle/wrapper
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o android-shell/gradle/wrapper/gradle-wrapper.jar
          fi
          cd android-shell
          ./gradlew assembleDebug --stacktrace

      - name: Run E2E Test on Android Emulator (Option C)
        id: android_e2e
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          force-avd-creation: true
          ram-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb devices
            adb install -r android-shell/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.ytviewer.app
            adb shell am start -a android.intent.action.VIEW -n com.ytviewer.app/.MainActivity -d "https://www.youtube.com/watch?v=n9qwEOsqsoo"
            adb shell screencap -p /sdcard/screen.png; adb pull /sdcard/screen.png ./android-emulator-screenshot.png || true
            bash scripts/android-e2e-assert.sh
            adb shell screencap -p /sdcard/screen.png; adb pull /sdcard/screen.png ./android-emulator-screenshot.png

      - name: Publish Android E2E Result to Job Summary
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.android_e2e.outcome }}
        run: |
          {
            echo "## Android Emulator E2E Result"
            echo ""
            echo "**Result:** \`${E2E_OUTCOME}\`"
            if [ "$E2E_OUTCOME" = "success" ]; then
              echo ""
              echo "The real Android app fetched non-empty default captions, then non-empty Hebrew and Italian favorite captions. The emulator assertion verified the response order."
              if [ -f android-emulator-logcat.txt ]; then
                echo ""
                echo '```text'
                grep "SUBTITLE_FETCH" android-emulator-logcat.txt | tail -n 20 || true
                echo '```'
              fi
            else
              echo ""
              echo "The emulator test did not pass. Relevant captured logcat:"
              if [ -f android-emulator-logcat.txt ]; then
                echo '```text'
                grep -E "APP_READY|APP_BOOT_ERROR|FATAL EXCEPTION|WebView error|Asset not found|SUBTITLE_FETCH" android-emulator-logcat.txt | tail -n 60 || echo "No matching diagnostic lines found."
                echo '```'
              else
                echo "Logcat was not produced."
              fi
            fi
            echo ""
            echo "The screenshot and full logcat are available in the \`android-emulator-artifacts\` workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android Emulator Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-artifacts
          path: |
            android-emulator-screenshot.png
            android-emulator-logcat.txt
            android-shell/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage Android Emulator Artifacts for GitHub Pages
        if: always()
        run: |
          mkdir -p gh-pages-staging/screenshots
          if [ -f "./android-emulator-screenshot.png" ]; then
            cp ./android-emulator-screenshot.png gh-pages-staging/screenshots/android-emulator-screenshot.png
            echo "Staged android-emulator-screenshot.png to gh-pages-staging/screenshots/"
          fi
          if [ -f "./android-emulator-logcat.txt" ]; then
            cp ./android-emulator-logcat.txt gh-pages-staging/screenshots/android-emulator-logcat.txt
            echo "Staged android-emulator-logcat.txt to gh-pages-staging/screenshots/"
          fi

      - name: Deploy Android Emulator Artifacts to GitHub Pages (gh-pages branch)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')) && !cancelled()
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-staging
          publish_branch: gh-pages
          destination_dir: .
          keep_files: true

