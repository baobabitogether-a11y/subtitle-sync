name: Publish Web Demo to GitHub Pages

on:
  workflow_run:
    workflows: ["Build & Release Android APK", "Android Emulator E2E Tests"]
    types:
      - completed
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  publish-web-demo:
    name: Publish Web Demo & Subtitle Artifacts to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize package registry URLs
        run: |
          if [ -f package-lock.json ]; then
            sed -i -E 's#https?://package-firewall\.replit\.internal/npm/#https://registry.npmjs.org/#g' package-lock.json 2>/dev/null || true
          fi

      - name: Install Web Dependencies
        timeout-minutes: 3
        run: npm install

      - name: Build Web Application
        timeout-minutes: 5
        run: |
          echo "⚙️ Compiling latest web application..."
          npm run build

      - name: Checkout Latest Emulator Report from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-emulator-report

      - name: Include Emulator Report and Captured Media in Pages Site
        run: |
          report_file="gh-pages-emulator-report/android-emulator-report.md"
          if [ -s "$report_file" ]; then
            cp "$report_file" dist/android-emulator-report.md
            echo "Included the latest emulator report in the Pages site."
          else
            echo "::warning::No published emulator report was found on gh-pages yet."
          fi

          media_dir="gh-pages-emulator-report/screenshots"
          if [ -d "$media_dir" ]; then
            mkdir -p dist/screenshots
            cp -a "$media_dir/." dist/screenshots/
            echo "Included captured emulator media in the Pages site."
          fi

      - name: Deploy Web Demo to GitHub Pages (gh-pages branch)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.event == 'workflow_dispatch'))) && !cancelled()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true

      - name: Setup GitHub Pages (Native Actions Mode)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.event == 'workflow_dispatch'))) && !cancelled()
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages Artifact (Native Actions Mode)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.event == 'workflow_dispatch'))) && !cancelled()
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./dist

      - name: Deploy to GitHub Pages (Native Actions Mode)
        id: deployment
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.event == 'workflow_dispatch'))) && !cancelled()
        uses: actions/deploy-pages@v4
        continue-on-error: true
